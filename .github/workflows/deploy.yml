name: Deploy Frontend Only

on:
  push:
    branches: ["main"]
    # Only trigger when files in the frontend folder OR the helm chart change
    paths:
      - 'frontend/**'
      - 'task-app/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Lower Case repository
        # Use GITHUB_OUTPUT to share the variable with the next job
        id: prep
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.REPO_LC }}-frontend:latest
            ghcr.io/${{ steps.prep.outputs.REPO_LC }}-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lower Case repository
        id: prep
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set Kubernetes Context
        run: kubectl config use-context minikube 

      - name: Deploy Frontend ONLY
        run: |
          # 2. FIXED: Added --reuse-values so it doesn't break the working backend
          # 3. FIXED: Pointed to the correct suffixed image name (-frontend)
          helm upgrade my-task-app ./task-app \
            --reuse-values \
            --set frontendImage="ghcr.io/${{ steps.prep.outputs.REPO_LC }}-frontend:${{ github.sha }}" \
            --wait
            
      - name: Verify Frontend Rollout
        run: kubectl rollout status deployment/frontend-task-app --timeout=90s
