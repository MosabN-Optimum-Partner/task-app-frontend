name: Validate Repository Build
on:
  push:
    branches: ["main"]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Lower Case repository
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Kubernetes Context
        run: |
          kubectl config use-context minikube 

      - name: Deploy Frontend ONLY
        run: |
          helm upgrade --install my-task-app ./task-app \
            --set frontendImage="ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}" \
            --wait
            
      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend-task-app --timeout=90s
        
              
  
